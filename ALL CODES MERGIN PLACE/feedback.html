    <link rel="icon" href="./Gemini_Generated_Image_r9haxmr9haxmr9ha.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<body>
    




<div class="feedback-box">


    <div class="feed-head-black">
        <div class="feed-head-detail">
            <h1>Create New Skill Swap Request</h1>
        </div>
        </div>




        <div class="feedback-sections" style="position: relative;">


            <div class="skillsneed">
    <h2>SKILL YOU NEED</h2>
    <input type="text" placeholder="e.g. Figma Design, Python Coding">
 </div>



       <div class="skillsneed1">
    <h2>SKILL OFFER YOU IN RETURN</h2>
    <input type="text" placeholder="e.g. Figma Design, Python Coding">
 </div>



       <div class="skillsneed2">
    <h2>PROPOSED SKILLPOINTS(LOCK AMOUNT)</h2>
    <input type="text" placeholder="e.g. Figma Design, Python Coding">
 </div>


       <div class="skillsneed3">
    <h2>EXCHANGE GUIDELINES/DURATION</h2>
   <textarea name="" id=""></textarea>
 </div>



 <div class="buttons">
    <div class="btn1">
           <button style="margin-bottom: 10px;">Send Swap Offer</button>
    </div>
     <div class="btn2">
           <button style="margin-bottom: 10px;">Cancel</button>
    </div>
 </div>


        </div>
    







    
</div>
